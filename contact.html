<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | TravelBD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
  <ul class="nav-left">
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#places">Places</a></li>
    <li><a href="index.html#hotels">Hotels</a></li>
    <li><a href="login.html">Login</a></li>
    <li><a href="reg.html">Registration</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-logo">
    <img src="img/logo.png" alt="Logo">
  </div>
</nav>

<!-- ===== CONTACT SECTION ===== -->
<section class="contact-section">
  <h1>Contact Us</h1>
  <p class="contact-sub">
    Have any questions? Feel free to contact us.
  </p>

  <div class="contact-container">

    <!-- LEFT INFO -->
    <div class="contact-info">
      <h2>Get in Touch</h2>
      <p><strong>Email:</strong> travelbd@gmail.com</p>
      <p><strong>Phone:</strong> +880 1580678828</p>
      <p><strong>Address:</strong> Dhaka, Bangladesh</p>
      <p>
        We are always ready to help you plan your perfect tour.
      </p>
    </div>

    <!-- RIGHT FORM -->
    <div class="contact-form">
      <h2>Send Message</h2>

      <input type="text" id="contactName" placeholder="Your Name" required>
      <input type="email" id="contactEmail" placeholder="Your Email">
      <textarea id="contactMessage" placeholder="Your Message" required></textarea>

      <button onclick="sendMessage()">Send Message</button>
    </div>

  </div>
</section>

<script>
async function sendMessage() {
  const name = document.getElementById("contactName").value;
  const email = document.getElementById("contactEmail").value;
  const message = document.getElementById("contactMessage").value;

  if (!name || !message) {
    alert("❌ Please fill in all required fields.");
    return;
  }

  try {
    const res = await fetch("http://localhost:5000/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, message })
    });

    const data = await res.json();
    alert(data.message || "✅ Message sent successfully!");
    
    // Clear form after success
    document.getElementById("contactName").value = "";
    document.getElementById("contactEmail").value = "";
    document.getElementById("contactMessage").value = "";
  } catch (err) {
    alert("❌ Error sending message. Please try again.");
  }
}
</script>

</body>
</html>
