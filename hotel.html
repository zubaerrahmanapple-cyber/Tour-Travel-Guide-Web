<!DOCTYPE html>
<html lang="en">
<head>

  <title>Hotel Details</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <ul class="nav-left">
    <li><a href="index.html">Home</a></li>
    <li><a href="place.html">Places</a></li>

    <img src="img/logo.png" alt="Logo">
  </div>
</nav>

<!-- HOTEL DETAILS -->
<div id="hotelDetails" class="details"></div>

<script>
  // URL parameter থেকে hotel id ধরো
  const params = new URLSearchParams(window.location.search);
  const hotel = params.get("hotel");

  // hotel.json থেকে ডেটা লোড করো
  fetch("hotel.json")
    .then(res => res.json())
    .then(data => {
      const h = data[hotel];
      if (!h) {
        document.getElementById("hotelDetails").innerHTML = "<h2>Hotel not found!</h2>";
        return;
      }

      document.getElementById("hotelDetails").innerHTML = `
        <h1>${h.name}</h1>
        <p>${h.info}</p>
        <h3>Rent: ${h.rent}</h3>
        <div class="grid">
          ${h.images.map(img => `<img src="${img}" class="detail-img">`).join("")}
        </div>
      `;
    });
</script>

</body>
</html>
